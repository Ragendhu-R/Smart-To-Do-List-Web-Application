<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Smart To-Do List - A modern, responsive task management dashboard with priorities, deadlines, progress tracking, and dark mode." />
  <title>Smart To-Do List | Modern Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-layout">
    <header class="top-nav">
      <div class="nav-container">
        <!-- Brand Logo & Name -->
        <div class="brand">
          <div class="brand-icon">
            <i class="fa-solid fa-check-double"></i>
          </div>
          <div class="brand-text">
            <h1 class="brand-title">Smart<span>Tasks</span></h1>
            <p class="brand-subtitle">Organize & Conquer</p>
          </div>
        </div>

        <!-- Header Actions: Date, Theme Switcher, Quick Add Button -->
        <div class="nav-actions">
          <div class="date-badge" id="currentDateDisplay" title="Current Date">
            <i class="fa-regular fa-calendar-days"></i>
            <span id="dateText">Today</span>
          </div>

          <!-- Theme Toggle Button -->
          <button id="themeToggleBtn" class="btn-icon theme-toggle-btn" aria-label="Toggle Theme" title="Switch Light/Dark Mode">
            <i class="fa-solid fa-moon moon-icon"></i>
            <i class="fa-solid fa-sun sun-icon"></i>
          </button>

          <!-- Primary Add Task Button -->
          <button id="openAddTaskModalBtn" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i>
            <span>New Task</span>
          </button>
        </div>
      </div>
    </header>
    <main class="main-content">
      <div class="content-wrapper">
        <section class="welcome-banner">
          <div class="welcome-text">
            <h2 id="greetingText">Welcome back! 👋</h2>
            <p id="greetingSubtext">Here is a quick overview of your current productivity status.</p>
          </div>
          <div class="quick-status-pill">
            <span class="status-dot"></span>
            <span id="quickStatusLabel">Active & Synced</span>
          </div>
        </section>

        <section class="stats-grid" aria-label="Task Statistics">
          <!-- Total Tasks Card -->
          <div class="stat-card total-card">
            <div class="stat-icon-wrapper">
              <i class="fa-solid fa-layer-group"></i>
            </div>
            <div class="stat-info">
              <span class="stat-label">Total Tasks</span>
              <span class="stat-number" id="totalTasksCount">0</span>
            </div>
            <div class="stat-footer">
              <span class="stat-meta">All logged items</span>
            </div>
          </div>

          <!-- Pending Tasks Card -->
          <div class="stat-card pending-card">
            <div class="stat-icon-wrapper">
              <i class="fa-solid fa-clock"></i>
            </div>
            <div class="stat-info">
              <span class="stat-label">Pending</span>
              <span class="stat-number" id="pendingTasksCount">0</span>
            </div>
            <div class="stat-footer">
              <span class="stat-meta text-warning"><span id="overdueCount">0</span> overdue</span>
            </div>
          </div>

          <!-- Completed Tasks Card -->
          <div class="stat-card completed-card">
            <div class="stat-icon-wrapper">
              <i class="fa-solid fa-circle-check"></i>
            </div>
            <div class="stat-info">
              <span class="stat-label">Completed</span>
              <span class="stat-number" id="completedTasksCount">0</span>
            </div>
            <div class="stat-footer">
              <span class="stat-meta text-success">Finished tasks</span>
            </div>
          </div>

          <!-- Overall Progress Card -->
          <div class="stat-card progress-card">
            <div class="stat-info-progress">
              <div class="progress-header">
                <span class="stat-label">Overall Progress</span>
                <span class="progress-percentage" id="progressPercentage">0%</span>
              </div>
              <div class="progress-bar-container" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar-fill" id="progressBarFill" style="width: 0%;"></div>
              </div>
              <p class="progress-caption" id="progressCaption">No tasks added yet</p>
            </div>
          </div>
        </section>

        <section class="toolbar-section">
          <div class="toolbar-top">
            <!-- Search Input Box -->
            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass search-icon"></i>
              <input type="text" id="taskSearchInput" placeholder="Search tasks by title or description..." autocomplete="off" />
              <button id="clearSearchBtn" class="clear-search-btn" title="Clear search" aria-label="Clear search" style="display: none;">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>

            <!-- Filter Status Tabs -->
            <div class="filter-tabs" role="tablist">
              <button class="filter-tab active" data-filter="all" role="tab" aria-selected="true">
                <i class="fa-solid fa-list-ul"></i>
                <span>All</span>
                <span class="badge" id="tabBadgeAll">0</span>
              </button>
              <button class="filter-tab" data-filter="pending" role="tab" aria-selected="false">
                <i class="fa-regular fa-clock"></i>
                <span>Pending</span>
                <span class="badge" id="tabBadgePending">0</span>
              </button>
              <button class="filter-tab" data-filter="completed" data-testid="completed-tab" role="tab" aria-selected="false">
                <i class="fa-regular fa-circle-check"></i>
                <span>Completed</span>
                <span class="badge" id="tabBadgeCompleted">0</span>
              </button>
            </div>
          </div>

          <!-- Toolbar Secondary: Priority & Sorting Dropdowns, Reset Filter & Clear Completed -->
          <div class="toolbar-bottom">
            <div class="filter-dropdowns">
              <!-- Priority Filter -->
              <div class="select-wrapper">
                <label for="priorityFilter" class="select-label">
                  <i class="fa-solid fa-flag"></i> Priority:
                </label>
                <select id="priorityFilter">
                  <option value="all">All Priorities</option>
                  <option value="high">High Priority</option>
                  <option value="medium">Medium Priority</option>
                  <option value="low">Low Priority</option>
                </select>
              </div>

              <!-- Sort Order -->
              <div class="select-wrapper">
                <label for="sortBySelect" class="select-label">
                  <i class="fa-solid fa-arrow-down-wide-short"></i> Sort By:
                </label>
                <select id="sortBySelect">
                  <option value="createdAt-desc">Newest First</option>
                  <option value="createdAt-asc">Oldest First</option>
                  <option value="dueDate-asc">Due Date (Earliest)</option>
                  <option value="priority-desc">Priority (High to Low)</option>
                  <option value="title-asc">Alphabetical (A-Z)</option>
                </select>
              </div>
            </div>

            <div class="toolbar-actions">
              <button id="clearCompletedBtn" class="btn btn-outline-danger" title="Remove all completed tasks" disabled>
                <i class="fa-regular fa-trash-can"></i>
                <span>Clear Completed</span>
              </button>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
